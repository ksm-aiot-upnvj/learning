  "assets/stylesheets/pin-lab.css",
  "assets/stylesheets/navigation.css",
  "assets/stylesheets/async-guide.css",
  "assets/stylesheets/ai-tour.css",
  "assets/stylesheets/ai-concept-labs.css",
  "assets/stylesheets/neuron-lab.css",
  "assets/stylesheets/document-layout.css",
]

extra_javascript = [
  "assets/javascripts/footer-year.mjs",
  "assets/javascripts/markdown-view.mjs",
  "assets/javascripts/ai-tour.mjs",
  "assets/javascripts/ai-concept-labs.mjs",
  "assets/javascripts/neuron-lab.mjs",
  "assets/javascripts/async-guide.mjs",
  "assets/javascripts/pin-lab.mjs",
