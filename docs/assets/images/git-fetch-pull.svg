  <title id="title">Git fetch dan git pull dengan merge</title>
  <desc id="desc">Sebelum fetch, main lokal di C, origin/main di B, dan main pada server di D. Fetch memperbarui origin/main ke D. Pull dengan merge membuat M dan memindahkan main lokal ke M.</desc>
