# AI Generated
services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    command:
      - --path.procfs=/host/proc
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
    volumes:
      - /proc:/host/proc:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
    volumes:
      - ./datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:13000:3000"

volumes:
  prometheus-data:
  grafana-data:
